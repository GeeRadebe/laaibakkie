<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>LaaiBakkie — SA Bakkie & Truck Hire</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --or:#FF6200;--ye:#FFD000;--ln:#9333EA;--dk:#0C0C0C;--sf:#161616;
  --cd:#1E1E1E;--br:#2A2A2A;--mu:#6B6B6B;--tx:#EFEFEF;
  --gr:#4ade80;--re:#f87171;--ln2:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--dk);color:var(--tx);font-family:'DM Sans',sans-serif;overflow-x:hidden;}
.D{font-family:'Barlow Condensed',sans-serif;}
.shell{max-width:430px;margin:0 auto;min-height:100vh;background:var(--dk);position:relative;}

/* Buttons */
.bp{background:var(--or);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:8px;padding:15px 20px;cursor:pointer;width:100%;transition:transform .12s,background .15s;}
.bp:active{transform:scale(.97);}
.bp:disabled{opacity:.38;cursor:not-allowed;}
.bs{background:transparent;color:var(--tx);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--br);border-radius:8px;padding:14px 20px;cursor:pointer;width:100%;transition:border-color .15s,color .15s;}
.bs:hover{border-color:var(--or);color:var(--or);}
.bl{background:linear-gradient(135deg,#6D28D9,#9333EA);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:8px;padding:15px 20px;cursor:pointer;width:100%;box-shadow:0 0 24px rgba(147,51,234,.3);transition:transform .12s;}
.bl:active{transform:scale(.97);}
.bl:disabled{opacity:.38;cursor:not-allowed;}
.by{background:var(--ye);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;border:none;border-radius:8px;padding:14px 20px;cursor:pointer;width:100%;}

/* Inputs */
.inp{background:var(--cd);border:1px solid var(--br);border-radius:8px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:.92rem;padding:13px 16px;width:100%;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--or);}
.inp::placeholder{color:var(--mu);}
.inp-ln:focus{border-color:var(--ln);}

/* Cards */
.c0{background:var(--cd);border:1px solid var(--br);border-radius:12px;}
.co{background:var(--cd);border:1px solid var(--or);border-radius:12px;}
.cl{background:rgba(147,51,234,.06);border:1px solid rgba(147,51,234,.3);border-radius:12px;}
.cg{background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.3);border-radius:12px;}

/* Badges */
.bg0{display:inline-flex;align-items:center;gap:4px;background:rgba(255,98,0,.14);color:var(--or);border:1px solid rgba(255,98,0,.28);border-radius:20px;padding:3px 10px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.bgg{background:rgba(74,222,128,.12);color:var(--gr);border-color:rgba(74,222,128,.28);}
.bgl{background:rgba(147,51,234,.14);color:var(--ln2);border-color:rgba(147,51,234,.3);}
.bgy{background:rgba(255,208,0,.12);color:var(--ye);border-color:rgba(255,208,0,.28);}

/* Layout */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 14px;border-bottom:1px solid var(--br);}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{display:none;}
.lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:8px;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--sf);border-top:1px solid var(--br);display:flex;z-index:200;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;font-size:.6rem;font-weight:500;color:var(--mu);cursor:pointer;gap:4px;text-transform:uppercase;letter-spacing:.04em;transition:color .2s;}
.ni.on{color:var(--or);}

/* Route dots */
.rl{display:flex;flex-direction:column;align-items:center;}
.rd{width:10px;height:10px;border-radius:50%;}
.rd.p{background:var(--gr);}
.rd.d{background:var(--or);}
.rc{width:2px;height:26px;background:repeating-linear-gradient(to bottom,var(--br) 0,var(--br) 4px,transparent 4px,transparent 8px);}

/* Vehicle card */
.vc{background:var(--cd);border:1.5px solid var(--br);border-radius:10px;padding:13px 10px;cursor:pointer;transition:border-color .15s,background .15s;text-align:center;position:relative;}
.vc.sel{border-color:var(--or);background:rgba(255,98,0,.07);}

/* Pay option */
.po{background:var(--cd);border:1.5px solid var(--br);border-radius:10px;padding:13px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;}
.po.sol{border-color:var(--or);background:rgba(255,98,0,.06);}
.po.sll{border-color:var(--ln);background:rgba(147,51,234,.07);}

/* Step dots */
.sd{width:8px;height:8px;border-radius:50%;background:var(--br);transition:background .3s;}
.sd.on{background:var(--or);}

/* Misc */
.stripe{background:repeating-linear-gradient(45deg,var(--or) 0,var(--or) 8px,#000 8px,#000 16px);}
.pchip{background:var(--or);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.7rem;padding:5px 14px 5px 10px;border-radius:6px;line-height:1.1;display:inline-block;}
.schip{background:rgba(147,51,234,.18);color:var(--ln2);border:1px solid rgba(147,51,234,.35);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;padding:3px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;}
.star-on{color:var(--ye);}
.star-off{color:var(--br);}
.qwrap{background:#fff;border-radius:10px;padding:10px;display:inline-block;}

/* Map mock */
.map{width:100%;height:200px;background:var(--sf);border-radius:12px;position:relative;overflow:hidden;}
.mgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,98,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,98,0,.05) 1px,transparent 1px);background-size:22px 22px;}
.mrh{position:absolute;height:3px;background:rgba(255,255,255,.09);left:0;right:0;}
.mrv{position:absolute;width:3px;background:rgba(255,255,255,.09);top:0;bottom:0;}

/* Animations */
@keyframes su{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.su{animation:su .32s ease both;}
.su2{animation:su .32s .1s ease both;}
.su3{animation:su .32s .18s ease both;}
.su4{animation:su .32s .26s ease both;}
@keyframes radar{0%{transform:scale(.5);opacity:.8;}100%{transform:scale(2.8);opacity:0;}}
.rr{position:absolute;width:76px;height:76px;border:2px solid var(--or);border-radius:50%;animation:radar 1.9s ease-out infinite;}
.rr:nth-child(2){animation-delay:.65s;}
.rr:nth-child(3){animation-delay:1.3s;}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(1.5);}}
.pdot{width:7px;height:7px;background:var(--gr);border-radius:50%;animation:pdot 1.4s ease-in-out infinite;display:inline-block;}
@keyframes tmove{0%{left:8%;top:62%;}40%{left:38%;top:42%;}70%{left:62%;top:50%;}100%{left:82%;top:36%;}}
.tk{position:absolute;font-size:20px;animation:tmove 7s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px rgba(255,98,0,.8));}
@keyframes pop{0%{transform:scale(0) rotate(-15deg);opacity:0;}65%{transform:scale(1.15) rotate(4deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
.pop{animation:pop .45s cubic-bezier(.175,.885,.32,1.275) both;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin 1s linear infinite;}
@keyframes pulse-ln{0%,100%{box-shadow:0 0 0 0 rgba(147,51,234,.6);}70%{box-shadow:0 0 0 12px rgba(147,51,234,0);}}
.pln{animation:pulse-ln 2s ease-in-out infinite;}

/* AI chat bubble */
.ai-bubble{background:rgba(147,51,234,.1);border:1px solid rgba(147,51,234,.25);border-radius:12px 12px 12px 2px;padding:12px 14px;font-size:.88rem;line-height:1.6;color:var(--tx);position:relative;}
.user-bubble{background:rgba(255,98,0,.1);border:1px solid rgba(255,98,0,.2);border-radius:12px 12px 2px 12px;padding:12px 14px;font-size:.88rem;line-height:1.6;color:var(--tx);}
@keyframes thinking{0%,80%,100%{transform:scale(0);opacity:.4;}40%{transform:scale(1);opacity:1;}}
.dot1{animation:thinking 1.2s .0s ease-in-out infinite;}
.dot2{animation:thinking 1.2s .2s ease-in-out infinite;}
.dot3{animation:thinking 1.2s .4s ease-in-out infinite;}
.typing-dot{width:7px;height:7px;background:var(--ln2);border-radius:50%;display:inline-block;margin:0 2px;}

/* Surge badge */
.surge{background:rgba(248,113,113,.12);color:#fca5a5;border:1px solid rgba(248,113,113,.3);border-radius:6px;padding:4px 10px;font-size:.7rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;}

/* Notif dot */
.ndot{position:absolute;top:-3px;right:-3px;background:var(--or);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.6rem;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

/* Match score ring */
.match-ring{width:52px;height:52px;position:relative;flex-shrink:0;}
.match-ring svg{transform:rotate(-90deg);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback} = React;

/* ── CONSTANTS ── */
const BTC_ZAR    = 1_840_000;
const SATS_BTC   = 100_000_000;
const LN_ADDR    = 'tediousguilty29@walletofsatoshi.com';
const zarToSats  = r => Math.round((r/BTC_ZAR)*SATS_BTC);
const fmtS       = s => s>=1000?(s/1000).toFixed(1)+'k':s+' sats';
const fmtR       = n => 'R'+n.toLocaleString('en-ZA');
const fmtBTC     = s => (s/SATS_BTC).toFixed(8);

const VEHICLES = [
  {id:'half', e:'🛻', n:'½-ton Bakkie', d:'Small loads · single items',    b:120, k:8,  kg:500},
  {id:'one',  e:'🚚', n:'1-ton Bakkie', d:'Furniture · appliances',        b:180, k:11, kg:1000},
  {id:'three',e:'🚛', n:'3-ton Truck',  d:'Full house moves · bulk',       b:350, k:16, kg:3000},
  {id:'eight',e:'🏗️', n:'8-ton Rigid',  d:'Construction · machinery',      b:650, k:24, kg:8000},
];
const GOODS = ['Furniture','Building Materials','Groceries / Stock','Appliances','Machinery','Garden / Outdoor','Electronics','Clothing & Boxes','Other'];
const CITIES = ['Johannesburg','Pretoria','Boksburg','Germiston','Soweto','Midrand','Centurion','Sandton','Randburg','Alberton'];
const PAYMENT = [
  {id:'lightning',icon:'⚡',lbl:'Lightning Network',sub:'Instant · Zero fees',ln:true},
  {id:'cash',     icon:'💵',lbl:'Cash on delivery', sub:'Pay driver directly'},
  {id:'card',     icon:'💳',lbl:'Card (tap / swipe)',sub:'At delivery'},
  {id:'snap',     icon:'📲',lbl:'SnapScan / Ozow',  sub:'QR on arrival'},
];

const calcPrice = (vid,dist,h) => {
  const v = VEHICLES.find(x=>x.id===vid);
  if(!v) return 0;
  const hour = new Date().getHours();
  const surge = (hour>=7&&hour<=9)||(hour>=16&&hour<=19) ? 1.2 : 1;
  return Math.round((v.b + v.k*dist + h*80)*surge);
};
const isSurge = () => { const h=new Date().getHours(); return (h>=7&&h<=9)||(h>=16&&h<=19); };

/* ── ICON SVGs ── */
const I = ({n,s=18,c='currentColor'}) => {
  const p = {
    back:  <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2.2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>,
    chk:   <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>,
    copy:  <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>,
    home:  <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
    wallet:<svg width={s} height={s} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12V7a2 2 0 00-2-2H3a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2v-5"/><circle cx="17" cy="12" r="1"/></svg>,
    hist:  <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
    user:  <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>,
    phone: <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.81 19.79 19.79 0 01.01 2.18 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>,
    shield:<svg width={s} height={s} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
    add:   <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>,
    minus: <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2.5" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>,
    send:  <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
    ai:    <svg width={s} height={s} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M12 2a10 10 0 110 20A10 10 0 0112 2z"/><path d="M12 8v4l3 3"/></svg>,
    spark: <svg width={s} height={s} fill={c} viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>,
  };
  return p[n]||null;
};

const Stars = ({r}) => [1,2,3,4,5].map(i=><span key={i} className={i<=Math.round(r)?'star-on':'star-off'}>★</span>);
const MatchRing = ({pct,color='var(--or)'}) => {
  const r=22, c=26, circ=2*Math.PI*r;
  return (
    <div className="match-ring">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx={c} cy={c} r={r} fill="none" stroke="var(--br)" strokeWidth="3"/>
        <circle cx={c} cy={c} r={r} fill="none" stroke={color} strokeWidth="3"
          strokeDasharray={circ} strokeDashoffset={circ-(pct/100)*circ} strokeLinecap="round"
          transform={`rotate(-90 ${c} ${c})`} style={{transition:'stroke-dashoffset .8s ease'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Barlow Condensed',fontWeight:900,fontSize:'.78rem',color}}>{pct}%</div>
    </div>
  );
};

/* ── QR ── */
const QR = ({value}) => {
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    ref.current.innerHTML='';
    try{ new window.QRCode(ref.current,{text:value,width:168,height:168,colorDark:'#000',colorLight:'#fff',correctLevel:window.QRCode.CorrectLevel.M}); }
    catch(e){ ref.current.innerHTML='<div style="width:168px;height:168px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#555;font-size:11px">QR</div>'; }
  },[value]);
  return <div className="qwrap"><div ref={ref}/></div>;
};

/* ── AI BOOKING PANEL ── */
const AIBooking = ({onFill, onClose}) => {
  const [msgs,   setMsgs]   = useState([{role:'ai',text:"Hey! Tell me what you need to move and where. I'll sort the booking for you."}]);
  const [input,  setInput]  = useState('');
  const [busy,   setBusy]   = useState(false);
  const [filled, setFilled] = useState(false);
  const bottomRef = useRef(null);

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs]);

  const send = async () => {
    if(!input.trim()||busy) return;
    const userMsg = input.trim();
    setInput('');
    setMsgs(m=>[...m,{role:'user',text:userMsg}]);
    setBusy(true);

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:600,
          system:`You are LaaiBakkie AI assistant for a SA bakkie/truck hire app. 
Extract booking details from user's natural language message and respond conversationally in South African English (use words like "lekker", "sharp", "eish" naturally but sparingly).
Always respond with a JSON block at the end of your message in this exact format:
<BOOKING>
{
  "pickup": "extracted pickup location or empty string",
  "dropoff": "extracted dropoff location or empty string", 
  "vehicle": "half|one|three|eight — pick best based on goods described. Default one",
  "goods": "what they're moving",
  "helpers": 0,
  "confidence": 0-100
}
</BOOKING>
If you can't extract enough info, ask a clarifying question and set confidence below 60.
Keep reply under 60 words before the JSON block.`,
          messages:[
            ...msgs.filter(m=>m.role!=='ai'||msgs.indexOf(m)>0).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text.split('<BOOKING>')[0].trim()})),
            {role:'user',content:userMsg}
          ]
        })
      });
      const data = await res.json();
      const full = data.content?.[0]?.text||'';
      const displayText = full.split('<BOOKING>')[0].trim();
      const jsonMatch = full.match(/<BOOKING>([\s\S]*?)<\/BOOKING>/);
      let extracted = null;
      if(jsonMatch){ try{ extracted = JSON.parse(jsonMatch[1].trim()); }catch(e){} }
      setMsgs(m=>[...m,{role:'ai',text:displayText,extracted}]);
      if(extracted && extracted.confidence>=70){ setFilled(true); }
    } catch(e){
      setMsgs(m=>[...m,{role:'ai',text:"Eish, connection issue. Try again or fill the form manually."}]);
    }
    setBusy(false);
  };

  const applyFill = () => {
    const last = [...msgs].reverse().find(m=>m.extracted && m.extracted.confidence>=70);
    if(last?.extracted) { onFill(last.extracted); onClose(); }
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',zIndex:500,display:'flex',flexDirection:'column',justifyContent:'flex-end',maxWidth:430,margin:'0 auto',left:0,right:0}}>
      <div style={{background:'var(--sf)',borderRadius:'16px 16px 0 0',border:'1px solid var(--br)',borderBottom:'none',maxHeight:'82vh',display:'flex',flexDirection:'column'}}>
        {/* Header */}
        <div style={{padding:'16px 20px',borderBottom:'1px solid var(--br)',display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:36,height:36,borderRadius:10,background:'linear-gradient(135deg,#6D28D9,#9333EA)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <I n="spark" s={18} c="#fff"/>
          </div>
          <div>
            <div className="D" style={{fontWeight:800,fontSize:'1.1rem',color:var('--ln2')}}>AI BOOKING ASSIST</div>
            <div style={{fontSize:'.72rem',color:'var(--mu)'}}>Powered by Claude · just describe your move</div>
          </div>
          <button onClick={onClose} style={{marginLeft:'auto',background:'none',border:'none',color:'var(--mu)',cursor:'pointer',fontSize:20,lineHeight:1}}>×</button>
        </div>

        {/* Messages */}
        <div className="scroll" style={{flex:1,padding:'16px 16px 8px',display:'flex',flexDirection:'column',gap:12}}>
          {msgs.map((m,i)=>(
            <div key={i} style={{display:'flex',flexDirection:'column',alignItems:m.role==='ai'?'flex-start':'flex-end',gap:4}}>
              {m.role==='ai' && <div style={{fontSize:'.68rem',color:'var(--mu)',marginLeft:2,display:'flex',alignItems:'center',gap:4}}><I n="spark" s={10} c="var(--ln2)"/>LaaiBakkie AI</div>}
              <div className={m.role==='ai'?'ai-bubble':'user-bubble'}>{m.text}</div>
              {m.extracted && m.extracted.confidence>=70 && (
                <div className="cl" style={{padding:'8px 12px',fontSize:'.75rem',marginTop:2,width:'100%'}}>

          <div className="lbl">Recent Trips</div>
          {[{f:'Boksburg',t:'Edenvale',dt:'Today 08:15',amt:220,pay:'lightning',r:5},{f:'Germiston',t:'Alberton',dt:'Yesterday',amt:340,pay:'cash',r:4},{f:'Sandton',t:'Midrand',dt:'Mon 09:00',amt:480,pay:'lightning',r:5}].map((tr,i)=>(
            <div key={i} className="c0" style={{padding:'11px 13px',marginBottom:8,display:'flex',alignItems:'center',gap:11}}>
              <div style={{fontSize:18}}>🚛</div>
              <div style={{flex:1}}>
                <div style={{fontSize:'.84rem',fontWeight:500}}>{tr.f} → {tr.t}</div>
                <div style={{fontSize:'.72rem',color:'var(--mu)',marginTop:2}}>{tr.dt} · <Stars r={tr.r}/></div>
              </div>
              <div style={{textAlign:'right'}}>
                <div className="D" style={{fontWeight:800,color:'var(--or)',fontSize:'.98rem'}}>{fmtR(tr.amt)}</div>
                {tr.pay==='lightning'&&<div style={{fontSize:'.68rem',color:'var(--ln2)'}}>{fmtS(zarToSats(tr.amt))}</div>}
              </div>
            </div>
          ))}
        </div>
      )}

      {tab==='wallet'&&(
        <div className="scroll" style={{flex:1,padding:'18px 18px 80px'}}>
          <div className="co" style={{padding:'22px 18px',textAlign:'center',marginBottom:11,borderRadius:14}}>
            <div style={{color:'var(--mu)',fontSize:'.76rem',textTransform:'uppercase',letterSpacing:'.1em'}}>ZAR Balance</div>
            <div className="D" style={{fontSize:'2.8rem',fontWeight:900,color:'var(--or)',margin:'7px 0'}}>R2,840</div>
            <div style={{fontSize:'.78rem',color:'var(--mu)'}}>Next payout: Friday</div>
          </div>
          <div className="cl" style={{padding:'16px 18px',marginBottom:18,borderRadius:14}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
              <div>
                <div style={{color:'var(--mu)',fontSize:'.7rem',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:3}}>Lightning Balance</div>
                <div className="D" style={{fontSize:'1.7rem',fontWeight:900,color:'var(--ln2)'}}>{fmtS(zarToSats(2840))}</div>
                <div style={{fontSize:'.78rem',color:'#9ca3af',marginTop:2}}>₿ {fmtBTC(zarToSats(2840))}</div>
              </div>
              <span style={{fontSize:26}}>⚡</span>
            </div>
            <div style={{borderTop:'1px solid rgba(147,51,234,.2)',marginTop:11,paddingTop:11}}>
              <div style={{fontSize:'.7rem',color:'var(--mu)',marginBottom:3}}>Lightning Address</div>
              <div style={{fontFamily:'monospace',fontSize:'.76rem',color:'var(--ln2)',fontWeight:600}}>{LN_ADDR}</div>
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:18}}>
            <button className="by" style={{padding:12,fontSize:'.9rem'}}>Withdraw ZAR</button>
            <button className="bl" style={{padding:12,fontSize:'.9rem'}}>Send Sats</button>
          </div>
          <div className="lbl">Payout History</div>
          {[{d:'18 Apr',a:2100,p:'lightning'},{d:'11 Apr',a:1850,p:'bank'},{d:'04 Apr',a:2640,p:'lightning'}].map((h,i)=>(
            <div key={i} className="c0" style={{padding:'11px 13px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontWeight:500,fontSize:'.86rem'}}>{h.p==='lightning'?'⚡ Lightning':'🏦 Bank Transfer'}</div>
                <div style={{fontSize:'.72rem',color:'var(--mu)',marginTop:2}}>{h.d}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div className="D" style={{fontWeight:800,color:'var(--gr)',fontSize:'.98rem'}}>{fmtR(h.a)}</div>
                {h.p==='lightning'&&<div style={{fontSize:'.68rem',color:'var(--ln2)'}}>{fmtS(zarToSats(h.a))}</div>}
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="bnav">
        {[{id:'home',i:<I n="home" s={20}/>,l:'Home'},{id:'wallet',i:<I n="wallet" s={20}/>,l:'Wallet'},{id:'hist',i:<I n="hist" s={20}/>,l:'History'},{id:'profile',i:<I n="user" s={20}/>,l:'Profile'}].map(x=>(
          <div key={x.id} className={'ni'+(tab===x.id?' on':'')} onClick={()=>setTab(x.id)}>{x.i}{x.l}</div>
        ))}
      </div>
    </div>
  );
};

/* ── APP ── */
function App(){
  const [screen,  setScreen]  = useState('splash');
  const [booking, setBooking] = useState(null);

  const go = s => setScreen(s);
  const handleNext = b => { setBooking(b); go(b.payment==='lightning'?'ln-pay':'searching'); };

  return (
    <div className="shell">
      {screen==='splash'     && <Splash onRole={r=>go(r==='customer'?'book':'driver')}/>}
      {screen==='book'       && <Booking onBack={()=>go('splash')} onNext={handleNext}/>}
      {screen==='ln-pay'     && <LightningPay booking={booking} onBack={()=>go('book')} onPaid={()=>go('searching')}/>}
      {screen==='searching'  && <Searching booking={booking} onMatched={()=>go('matched')}/>}
      {screen==='matched'    && <Matched booking={booking} onTrack={()=>go('tracking')}/>}
      {screen==='tracking'   && <Tracking booking={booking} onDone={()=>go('splash')}/>}
      {screen==='driver'     && <DriverHome onBack={()=>go('splash')}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
