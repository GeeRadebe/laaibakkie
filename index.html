<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>LaaiBakkie — SA Bakkie & Truck Hire</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--orange:#FF6200;--yellow:#FFD000;--bitcoin:#F7931A;--ln:#9333EA;--dark:#0E0E0E;--surface:#181818;--card:#222;--border:#2E2E2E;--muted:#777;--text:#F0F0F0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
.display{font-family:'Barlow Condensed',sans-serif;}
.app-shell{max-width:420px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;background:var(--dark);}
.stripe{background:repeating-linear-gradient(45deg,var(--orange) 0px,var(--orange) 8px,#000 8px,#000 16px);}
.btn-primary{background:var(--orange);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase;border:none;border-radius:6px;padding:14px 24px;cursor:pointer;width:100%;transition:all .15s;}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-secondary{background:transparent;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--border);border-radius:6px;padding:13px 24px;cursor:pointer;width:100%;transition:all .15s;}
.btn-yellow{background:var(--yellow);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;border:none;border-radius:6px;padding:13px 24px;cursor:pointer;width:100%;transition:all .15s;}
.btn-ln{background:linear-gradient(135deg,#7C3AED,#9333EA);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase;border:none;border-radius:6px;padding:14px 24px;cursor:pointer;width:100%;transition:all .15s;box-shadow:0 0 20px rgba(147,51,234,.3);}
.input-field{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;padding:13px 16px;width:100%;outline:none;transition:border-color .2s;}
.input-field:focus{border-color:var(--orange);}
.input-field::placeholder{color:var(--muted);}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;}
.card-orange{background:var(--card);border:1px solid var(--orange);border-radius:10px;}
.card-ln{background:rgba(147,51,234,.06);border:1px solid rgba(147,51,234,.35);border-radius:10px;}
.vehicle-card{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .15s;text-align:center;position:relative;}
.vehicle-card.selected{border-color:var(--orange);background:rgba(255,98,0,.08);}
.badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,98,0,.15);color:var(--orange);border:1px solid rgba(255,98,0,.3);border-radius:20px;padding:3px 10px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.badge-green{background:rgba(34,197,94,.12);color:#4ade80;border-color:rgba(34,197,94,.3);}
.badge-yellow{background:rgba(255,208,0,.12);color:var(--yellow);border-color:rgba(255,208,0,.3);}
.badge-ln{background:rgba(147,51,234,.15);color:#c084fc;border-color:rgba(147,51,234,.4);}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.4);}}
.pulse-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;animation:pulse-dot 1.4s ease-in-out infinite;display:inline-block;}
@keyframes radar{0%{transform:scale(.5);opacity:.8;}100%{transform:scale(2.5);opacity:0;}}
.radar-ring{position:absolute;width:80px;height:80px;border:2px solid var(--orange);border-radius:50%;animation:radar 1.8s ease-out infinite;}
.radar-ring:nth-child(2){animation-delay:.6s;}
.radar-ring:nth-child(3){animation-delay:1.2s;}
@keyframes slide-up{from{transform:translateY(28px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.slide-up{animation:slide-up .35s ease both;}
.slide-up-2{animation:slide-up .35s .1s ease both;}
.slide-up-3{animation:slide-up .35s .2s ease both;}
.slide-up-4{animation:slide-up .35s .3s ease both;}
@keyframes truck-move{0%{left:10%;top:60%;}50%{left:55%;top:40%;}100%{left:82%;top:45%;}}
.moving-truck{position:absolute;font-size:20px;animation:truck-move 6s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px rgba(255,98,0,.8));}
@keyframes check-pop{0%{transform:scale(0) rotate(-20deg);opacity:0;}70%{transform:scale(1.2) rotate(5deg);}100%{transform:scale(1) rotate(0deg);opacity:1;}}
.check-pop{animation:check-pop .5s cubic-bezier(.175,.885,.32,1.275) both;}
@keyframes bolt-spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.bolt-spin{animation:bolt-spin 1.2s linear infinite;}
.section-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.route-line{display:flex;flex-direction:column;align-items:center;}
.route-dot{width:10px;height:10px;border-radius:50%;}
.route-dot.pickup{background:#4ade80;}
.route-dot.dropoff{background:var(--orange);}
.route-connector{width:2px;height:28px;background:repeating-linear-gradient(to bottom,var(--border) 0px,var(--border) 4px,transparent 4px,transparent 8px);}
.price-chip{background:var(--orange);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.8rem;padding:4px 16px 4px 12px;border-radius:6px;display:inline-block;line-height:1.1;}
.sats-chip{background:rgba(147,51,234,.2);color:#c084fc;border:1px solid rgba(147,51,234,.4);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;padding:3px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;}
.pay-option{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:12px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;}
.pay-option.sel{border-color:var(--orange);background:rgba(255,98,0,.06);}
.pay-option.sel-ln{border-color:#9333EA;background:rgba(147,51,234,.07);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;font-size:.65rem;font-weight:500;color:var(--muted);cursor:pointer;gap:4px;transition:color .2s;font-family:'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.04em;}
.nav-item.active{color:var(--orange);}
.scroll-area{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.scroll-area::-webkit-scrollbar{display:none;}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .3s;}
.step-dot.active{background:var(--orange);}
.star-filled{color:var(--yellow);}
.star-empty{color:var(--border);}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--orange);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.65rem;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.qr-wrap{background:#fff;border-radius:12px;padding:10px;display:inline-block;}
#qr-render canvas,#qr-render img{width:170px!important;height:170px!important;}
.map-placeholder{width:100%;height:200px;background:var(--surface);border-radius:10px;position:relative;overflow:hidden;}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,98,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,98,0,.06) 1px,transparent 1px);background-size:24px 24px;}
.map-road-h{position:absolute;height:3px;background:rgba(255,255,255,.1);left:0;right:0;}
.map-road-v{position:absolute;width:3px;background:rgba(255,255,255,.1);top:0;bottom:0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── CONSTANTS ── */
const BTC_ZAR    = 1820000;
const SATS_BTC   = 100000000;
const LN_ADDRESS = 'tediousguilty29@walletofsatoshi.com';
const zarToSats  = r => Math.round((r / BTC_ZAR) * SATS_BTC);
const fmtSats    = s => s >= 1000000 ? (s/1000000).toFixed(3)+' M sats' : s >= 1000 ? (s/1000).toFixed(1)+'k sats' : s+' sats';
const fmtZAR     = n => 'R'+n.toLocaleString('en-ZA');
const fmtBTC     = s => (s/SATS_BTC).toFixed(8);
const genInvoice = sats => {
  const ab = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const r = n => Array.from({length:n},()=>ab[Math.floor(Math.random()*ab.length)]).join('');
  return 'lnbc'+sats+'n1p'+r(8)+'pp'+r(52)+'qp'+r(40);
};

/* ── DATA ── */
const VEHICLES = [
  {id:'half', emoji:'🛻', label:'½-ton Bakkie', desc:'Small loads',        base:120, perKm:8,  maxKg:500},
  {id:'one',  emoji:'🚚', label:'1-ton Bakkie',  desc:'Furniture & appliances', base:180, perKm:11, maxKg:1000},
  {id:'three',emoji:'🚛', label:'3-ton Truck',   desc:'Full room moves',   base:350, perKm:16, maxKg:3000},
  {id:'eight',emoji:'🏗️', label:'8-ton Rigid',   desc:'Construction, machinery', base:650, perKm:24, maxKg:8000},
];
const GOODS   = ['Furniture','Building Materials','Groceries / Stock','Appliances','Machinery','Garden / Outdoor','Other'];
const CITIES  = ['Johannesburg','Pretoria','Boksburg','Germiston','Soweto','Midrand','Centurion','Sandton'];
const PAYMENT = [
  {id:'lightning', icon:'⚡', label:'Lightning Network', sub:'Instant · Zero fees', ln:true},
  {id:'cash',      icon:'💵', label:'Cash on delivery',  sub:'Pay driver directly'},
  {id:'card',      icon:'💳', label:'Card (tap / swipe)', sub:'At delivery'},
  {id:'snap',      icon:'📲', label:'SnapScan / Ozow',   sub:'QR on arrival'},
];
const calcPrice = (v,d,h) => { const vv=VEHICLES.find(x=>x.id===v); return Math.round(vv.base+vv.perKm*d+h*80); };

/* ── SMALL HELPERS ── */
const Stars = ({rating}) => <span>{[1,2,3,4,5].map(i=><span key={i} className={i<=Math.round(rating)?'star-filled':'star-empty'}>★</span>)}</span>;

const Ico = ({n,sz=18,c='currentColor'}) => {
  const m = {
    back:   <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2.2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>,
    chk:    <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>,
    copy:   <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>,
    wallet: <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12V7a2 2 0 00-2-2H3a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2v-5"/><circle cx="17" cy="12" r="1"/></svg>,
    home:   <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
    hist:   <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
    user:   <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>,
    phone:  <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.81 19.79 19.79 0 01.01 2.18 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>,
    shield: <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
    add:    <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>,
    minus:  <svg width={sz} height={sz} fill="none" stroke={c} strokeWidth="2.5" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>,
  };
  return m[n]||null;
};

/* ── QR RENDERER ── */
const QRBlock = ({value}) => {
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    ref.current.innerHTML = '';
    try {
      new window.QRCode(ref.current, {text:value, width:170, height:170, colorDark:'#000', colorLight:'#fff', correctLevel:window.QRCode.CorrectLevel.M});
    } catch(e){
      ref.current.innerHTML = '<div style="width:170px;height:170px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#555;font-size:12px">QR Preview</div>';
    }
  },[value]);
  return <div className="qr-wrap"><div id="qr-render" ref={ref}/></div>;
};

/* ─────────────────────────
   SCREEN: LIGHTNING PAYMENT
───────────────────────── */
const LightningPayment = ({booking, onPaid, onBack}) => {
  const sats    = booking.sats;
  const invoice = useRef(genInvoice(sats)).current;
  const [tab, setTab]           = useState('invoice');
  const [status, setStatus]     = useState('pending');
  const [copied, setCopied]     = useState(false);
  const [addrCop, setAddrCop]   = useState(false);
  const [countdown, setCountdown] = useState(90);

  useEffect(()=>{
    const payAt = 10 + Math.floor(Math.random()*6);
    let elapsed = 0;
    const t = setInterval(()=>{
      elapsed++;
      setCountdown(c=>{ if(c<=1){clearInterval(t);setStatus('expired');return 0;} return c-1; });
      if(elapsed===3) setStatus('scanning');
      if(elapsed===payAt){ clearInterval(t); setStatus('paid'); }
    },1000);
    return ()=>clearInterval(t);
  },[]);

  const copyText = (txt, setter) => {
    try{ navigator.clipboard.writeText(txt); }catch(e){}
    setter(true); setTimeout(()=>setter(false),2200);
  };

  if(status==='paid') return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px',textAlign:'center'}}>
      <div className="check-pop" style={{width:88,height:88,borderRadius:'50%',background:'rgba(34,197,94,.12)',border:'2px solid #4ade80',display:'flex',alignItems:'center',justifyContent:'center',fontSize:40,marginBottom:24}}>⚡</div>
      <div className="display" style={{fontSize:'2.4rem',fontWeight:900,color:'#4ade80',letterSpacing:'.02em',marginBottom:4}}>PAYMENT RECEIVED</div>
      <div style={{color:'var(--muted)',fontSize:'.88rem',marginBottom:28}}>Lightning settled · Routed via Wallet of Satoshi</div>
      <div className="card-ln" style={{padding:'20px',width:'100%',marginBottom:24}}>
        {[
          ['Amount (ZAR)',    fmtZAR(booking.price),  'var(--text)'],
          ['Amount (sats)',   fmtSats(sats),           '#c084fc'],
          ['Amount (BTC)',    '₿ '+fmtBTC(sats),       '#fbbf24'],
          ['Wallet',         LN_ADDRESS,              '#c084fc'],
          ['Rate locked',    fmtZAR(BTC_ZAR)+'/BTC',  'var(--muted)'],
        ].map(([k,v,col])=>(
          <div key={k} style={{display:'flex',justifyContent:'space-between',marginBottom:10,fontSize:'.84rem'}}>
            <span style={{color:'var(--muted)'}}>{k}</span>
            <span style={{fontWeight:600,color:col,textAlign:'right',maxWidth:220,wordBreak:'break-all'}}>{v}</span>
          </div>
        ))}
      </div>
      <div style={{fontSize:'.75rem',color:'#6b7280',marginBottom:28,lineHeight:1.7}}>
        Zero fees · Instant settlement · Censorship-resistant · Powered by Bitcoin
      </div>
      <button className="btn-ln" onClick={onPaid}>Continue → Find Driver</button>
    </div>
  );

  if(status==='expired') return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px',textAlign:'center'}}>
      <div style={{fontSize:52,marginBottom:14}}>⏱</div>
      <div className="display" style={{fontSize:'2rem',fontWeight:900,color:'#f87171',marginBottom:8}}>INVOICE EXPIRED</div>
      <div style={{color:'var(--muted)',fontSize:'.88rem',marginBottom:32}}>Lightning invoices expire after 90s for security. Generate a new one.</div>
      <button className="btn-ln" style={{marginBottom:12}} onClick={()=>window.location.reload()}>New Invoice</button>
      <button className="btn-secondary" onClick={onBack}>Go Back</button>
    </div>
  );

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <div className="topbar">
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text)',display:'flex',alignItems:'center',gap:6}}><Ico n="back"/></button>
        <div className="display" style={{fontSize:'1.2rem',fontWeight:800,letterSpacing:'.05em',display:'flex',alignItems:'center',gap:8}}>
          <span style={{color:'#c084fc'}}>⚡</span> PAY WITH LIGHTNING
        </div>
        <span className="badge badge-ln" style={{fontSize:'.62rem',padding:'3px 8px'}}>
          {status==='scanning' ? <><span className="pulse-dot" style={{width:5,height:5,background:'#c084fc'}}/>Live</> : 'Pending'}
        </span>
      </div>

      <div className="scroll-area" style={{flex:1,padding:'20px 20px 130px'}}>
        {/* Amount block */}
        <div className="card-ln" style={{padding:'18px',textAlign:'center',marginBottom:20}}>
          <div style={{color:'var(--muted)',fontSize:'.7rem',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>Pay exactly</div>
          <div className="display" style={{fontSize:'2.5rem',fontWeight:900,color:'#c084fc',lineHeight:1}}>{fmtSats(sats)}</div>
          <div style={{color:'var(--muted)',fontSize:'.84rem',marginTop:6}}>{fmtZAR(booking.price)} · ₿ {fmtBTC(sats)}</div>
          <div style={{fontSize:'.7rem',color:'#6b7280',marginTop:4}}>Rate: 1 BTC = {fmtZAR(BTC_ZAR)} (locked at booking)</div>
          {/* Countdown */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,marginTop:14}}>
            <svg width="38" height="38" viewBox="0 0 38 38">
              <circle cx="19" cy="19" r="16" fill="none" stroke="var(--border)" strokeWidth="2.5"/>
              <circle cx="19" cy="19" r="16" fill="none"
                stroke={countdown>30?'#9333EA':countdown>10?'#fbbf24':'#f87171'} strokeWidth="2.5"
                strokeDasharray="100" strokeDashoffset={100-(countdown/90)*100}
                strokeLinecap="round" transform="rotate(-90 19 19)"
                style={{transition:'stroke-dashoffset 1s linear,stroke .5s'}}/>
            </svg>
            <span className="display" style={{fontWeight:800,fontSize:'1.1rem',color:countdown>30?'#c084fc':countdown>10?'#fbbf24':'#f87171'}}>{countdown}s</span>
            <span style={{fontSize:'.75rem',color:'var(--muted)'}}>to expire</span>
          </div>
        </div>

        {/* Tabs */}
        <div style={{display:'flex',background:'var(--surface)',borderRadius:8,padding:3,gap:2,marginBottom:20}}>
          {[['invoice','⚡ BOLT11 Invoice'],['address','📬 LN Address']].map(([id,lbl])=>(
            <div key={id} onClick={()=>setTab(id)} style={{flex:1,textAlign:'center',padding:'9px 4px',borderRadius:6,cursor:'pointer',fontFamily:'Barlow Condensed',fontWeight:700,fontSize:'.82rem',letterSpacing:'.04em',textTransform:'uppercase',background:tab===id?'#7C3AED':'transparent',color:tab===id?'#fff':'var(--muted)',transition:'all .2s'}}>
              {lbl}
            </div>
          ))}
        </div>

        {tab==='invoice' && (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
            <QRBlock value={'lightning:'+invoice}/>
            <div style={{fontSize:'.82rem',color:'var(--muted)',textAlign:'center',lineHeight:1.6,maxWidth:280}}>
              Open your Lightning wallet and scan the QR, or copy the invoice string below.
            </div>
            <div className="card" style={{padding:'12px 14px',width:'100%'}}>
              <div style={{fontSize:'.67rem',color:'var(--muted)',marginBottom:6,textTransform:'uppercase',letterSpacing:'.08em'}}>BOLT11 Invoice</div>
              <div style={{fontFamily:'monospace',fontSize:'.7rem',color:'#c084fc',wordBreak:'break-all',lineHeight:1.5,marginBottom:10}}>{invoice.substring(0,60)}…</div>

              <button key={id} style={{flex:1,background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,padding:10,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:6,color:'var(--text)'}}>
                {ico}<span style={{fontSize:'.75rem',fontWeight:500}}>{lbl}</span>
              </button>
            ))}
            <button style={{flex:1,background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.3)',borderRadius:8,padding:10,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
              <Ico n="shield" sz={20} c="#f87171"/><span style={{fontSize:'.75rem',fontWeight:500,color:'#f87171'}}>Panic</span>
            </button>

        </div>
      </div>

};

/* ─────────── TRACKING ─────────── */
const CustomerTracking = ({booking, onDone}) => {
  const [progress, setProgress] = useState(15);
  useEffect(()=>{
    const t=setInterval(()=>setProgress(p=>{if(p>=100){clearInterval(t);return 100;}return p+(Math.random()*3+.5);}),600);
    return ()=>clearInterval(t);
  },[]);
  const done = progress>=100;
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <div className="topbar">
        <div className="display" style={{fontSize:'1.2rem',fontWeight:800,letterSpacing:'.05em'}}>{done?'✅ TRIP COMPLETE':'🛻 LIVE TRACKING'}</div>
        <span className="badge badge-green"><span className="pulse-dot" style={{width:5,height:5}}/>Live</span>
      </div>
      <div className="scroll-area" style={{flex:1,padding:'20px 20px 100px'}}>
        <div className="map-placeholder" style={{marginBottom:20}}>
          <div className="map-grid"/>
          <div className="map-road-h" style={{top:'40%'}}/><div className="map-road-h" style={{top:'65%'}}/>
          <div className="map-road-v" style={{left:'30%'}}/><div className="map-road-v" style={{left:'65%'}}/>
          <div style={{position:'absolute',left:'12%',top:'55%',fontSize:18}}>📍</div>
          <div style={{position:'absolute',right:'10%',top:'30%',fontSize:18}}>🏁</div>
          <div className="moving-truck">🚛</div>
        </div>
        <div className="card" style={{padding:'16px',marginBottom:20}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
            <span className="display" style={{fontWeight:800,fontSize:'1rem'}}>{done?'Arrived at drop-off':'En route · '+Math.round(progress)+'%'}</span>
            <span style={{color:'var(--orange)',fontWeight:700,fontSize:'.85rem'}}>{done?'Done!':'~'+Math.max(1,Math.round((100-progress)/8))+' min'}</span>
          </div>
          <div style={{background:'var(--surface)',borderRadius:4,height:8,overflow:'hidden'}}>
            <div style={{height:'100%',background:done?'#4ade80':'var(--orange)',width:Math.min(100,progress)+'%',borderRadius:4,transition:'width .6s ease'}}/>
          </div>
        </div>
        {done && (
          <div className="card-ln slide-up" style={{padding:'20px',textAlign:'center'}}>
            <div style={{fontSize:36,marginBottom:8}}>✅</div>
            <div className="display" style={{fontSize:'1.6rem',fontWeight:900}}>DELIVERY COMPLETE</div>
            <div style={{color:'var(--muted)',fontSize:'.85rem',marginTop:4}}>Rate Sipho's service</div>
            <div style={{margin:'14px 0',fontSize:28}}>{[1,2,3,4,5].map(s=><span key={s} style={{cursor:'pointer',color:s<=4?'var(--yellow)':'var(--border)',marginRight:4}}>★</span>)}</div>
            <div className="display" style={{fontWeight:900,fontSize:'1.3rem',color:booking.payment==='lightning'?'#c084fc':'var(--orange)'}}>
              {booking.payment==='lightning'?'⚡ '+fmtSats(booking.sats):fmtZAR(booking.price)}
            </div>
            <div style={{fontSize:'.74rem',color:'var(--muted)',marginTop:2}}>
              {booking.payment==='lightning'?'= '+fmtZAR(booking.price)+' · Lightning settled':PAYMENT.find(p=>p.id===booking.payment).label}
            </div>
          </div>
        )}
      </div>
      {done && (
        <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:420,background:'var(--dark)',borderTop:'1px solid var(--border)',padding:'16px 20px 28px'}}>
          <button className="btn-primary" onClick={onDone}>Submit Rating &amp; Done</button>
        </div>
      )}
    </div>
  );
};

            <div style={{fontSize:'.8rem',color:'var(--muted)'}}>Next payout: Friday</div>
          </div>
          <div className="card-ln" style={{padding:'18px 20px',marginBottom:20,borderRadius:14}}>

              <div>
                <div style={{color:'var(--muted)',fontSize:'.72rem',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>Lightning Balance</div>
                <div className="display" style={{fontSize:'1.8rem',fontWeight:900,color:'#c084fc'}}>{fmtSats(zarToSats(2840))}</div>

/* ─────────── APP ─────────── */
function App() {
  const [screen, setScreen]   = useState('splash');
  const [booking, setBooking] = useState(null);

  const handleBookingNext = b => {
    setBooking(b);
    setScreen(b.payment==='lightning' ? 'lightning-pay' : 'searching');
  };

  return (
    <div className="app-shell">
      {screen==='splash'        && <Splash onRole={r=>setScreen(r==='customer'?'book':'driver')}/>}
      {screen==='book'          && <CustomerBooking onBack={()=>setScreen('splash')} onNext={handleBookingNext}/>}
      {screen==='lightning-pay' && <LightningPayment booking={booking} onBack={()=>setScreen('book')} onPaid={()=>setScreen('searching')}/>}
      {screen==='searching'     && <CustomerSearching booking={booking} onMatched={()=>setScreen('matched')}/>}
      {screen==='matched'       && <DriverMatched booking={booking} onTrack={()=>setScreen('tracking')}/>}
      {screen==='tracking'      && <CustomerTracking booking={booking} onDone={()=>setScreen('splash')}/>}
      {screen==='driver'        && <DriverHome onBack={()=>setScreen('splash')}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
